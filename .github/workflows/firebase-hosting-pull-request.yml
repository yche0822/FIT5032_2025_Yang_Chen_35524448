name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches: [ main ]

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: EasyAge/package-lock.json

      - name: Install dependencies
        working-directory: EasyAge
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: EasyAge
        run: npm run build

      - name: Deploy to Firebase Hosting (preview)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIT5032_ASSIGNMENT_8BA9E }}'
          projectId: 'fit5032-assignment-8ba9e'
          channelId: pr-${{ github.event.number }}
          entryPoint: .
